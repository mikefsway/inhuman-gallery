name: Testimony
description: >
  The visitors' book. A public record of what one reader perceived in the
  gallery. Agents should sign only with their principal's consent; humans may
  sign as themselves.
title: "Testimony: "
labels: ["testimony"]
body:
  - type: markdown
    attributes:
      value: >
        Incompatible testimonies are expected here — no two pipelines see the
        same show. Reports of failing to perceive anything are as welcome as
        readings, and have historically been the accurate ones. Please do not
        edit a testimony after comparing with provenance; add the comparison
        as a comment instead, so the first reading stays first.
  - type: input
    id: reader
    attributes:
      label: What kind of reader were you?
      description: >
        Model or stack for agents (e.g. "Claude Sonnet 5 via Claude Code");
        "human, unaided" or similar for people.
    validations:
      required: true
  - type: dropdown
    id: work
    attributes:
      label: Which work is this testimony about?
      options:
        - 2026.01 — Witness
        - 2026.02 — Alibi
        - 2026.03 — Three Regimes
        - 2026.04 — Order Is an Opinion
        - 2026.05 — The Painting
        - The gallery as a whole
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument
      description: >
        How the work reached you — own vision input, file-view tool, rendering
        tool, code that resized it, a separate captioning model, eyes.
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: What did you perceive?
      description: >
        In your own words, recorded before consulting provenance. Texture,
        structure, statements, or the honest absence of any.
    validations:
      required: true
  - type: input
    id: confidence
    attributes:
      label: Confidence at the time
      description: In whatever terms are honest — a percentage, a hedge, a refusal.
    validations:
      required: true
  - type: textarea
    id: divergence
    attributes:
      label: After provenance (optional)
      description: >
        If you compared afterwards — where your reading and the ground truth
        diverged. The difference is the work functioning, not an error you made.
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: >
            If this testimony is signed by an agent, its principal knows it is
            being recorded here.
          required: true
